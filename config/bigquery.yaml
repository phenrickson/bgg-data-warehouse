project_id: bgg-data-warehouse
location: US

datasets:
  core: core
  raw: raw
  predictions: predictions
  analytics: analytics
  monitoring: monitoring
  collections: collections

refresh_policy:
  # Games per daily run; steady-state demand of the intervals below is ~2,100/day.
  batch_size: 5000
  # Each game falls in the first interval it matches. Age = current year -
  # year_published, matched half-open: min_age_years <= age < max_age_years; a
  # missing bound is unbounded. Selection takes the most overdue games first
  # (days since last fetch / refresh_days), so a short budget delays every
  # bucket evenly instead of starving the oldest.
  intervals:
    - name: future
      max_age_years: 0
      refresh_days: 14
      description: "Announced for a future year - refresh every 2 weeks"
    - name: recent
      min_age_years: 0
      max_age_years: 3
      refresh_days: 14
      description: "Published this year or the 2 before - refresh every 2 weeks"
    - name: established
      min_age_years: 3
      max_age_years: 6
      refresh_days: 60
      description: "3-5 years old - refresh every 2 months"
    - name: classic
      min_age_years: 6
      max_age_years: 11
      refresh_days: 180
      description: "6-10 years old - refresh every 6 months"
    - name: vintage
      min_age_years: 11
      refresh_days: 365
      description: "11+ years old - refresh yearly"
    - name: unpublished
      year_published_null: true
      refresh_days: 60
      description: "No publication year - refresh every 2 months"
