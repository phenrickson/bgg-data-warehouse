# Cloud Build configuration for BGG processor
steps:
  # Build the processor image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'docker/Dockerfile.pipeline', '-t', 'gcr.io/$PROJECT_ID/bgg-processor:latest', '.']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bgg-processor:latest']

  # TEMPORARY (BGG.CON 2026): the recorder's own small image (docker/Dockerfile.bggcon). It
  # cold-starts every minute during the con, so it carries none of the pipeline's Chromium.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'docker/Dockerfile.bggcon', '-t', 'gcr.io/$PROJECT_ID/bgg-bggcon-recorder:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bgg-bggcon-recorder:latest']

  # Deploy Fetch Thing IDs Cloud Run Job - Create if not exists, otherwise update
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud run jobs describe bgg-fetch-thing-ids --region=us-central1 2>/dev/null; then
          echo "Updating existing job: bgg-fetch-thing-ids"
          gcloud run jobs update bgg-fetch-thing-ids \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.fetch_thing_ids \
            --tasks=1 \
            --max-retries=3 \
            --task-timeout=1h \
            --memory=8Gi \
            --cpu=2 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com
        else
          echo "Creating new job: bgg-fetch-thing-ids"
          gcloud run jobs create bgg-fetch-thing-ids \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.fetch_thing_ids \
            --tasks=1 \
            --max-retries=3 \
            --task-timeout=1h \
            --memory=8Gi \
            --cpu=2 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com
        fi

  # Deploy Fetch New Games Cloud Run Job - Create if not exists, otherwise update
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud run jobs describe bgg-fetch-new-games --region=us-central1 2>/dev/null; then
          echo "Updating existing job: bgg-fetch-new-games"
          gcloud run jobs update bgg-fetch-new-games \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.fetch_new_games \
            --tasks=1 \
            --max-retries=1 \
            --task-timeout=1h \
            --memory=2Gi \
            --cpu=1 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=BGG_API_TOKEN=$_BGG_API_TOKEN
        else
          echo "Creating new job: bgg-fetch-new-games"
          gcloud run jobs create bgg-fetch-new-games \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.fetch_new_games \
            --tasks=1 \
            --max-retries=1 \
            --task-timeout=1h \
            --memory=2Gi \
            --cpu=1 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=BGG_API_TOKEN=$_BGG_API_TOKEN
        fi

  # Deploy Refresh Old Games Cloud Run Job - Create if not exists, otherwise update
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud run jobs describe bgg-refresh-old-games --region=us-central1 2>/dev/null; then
          echo "Updating existing job: bgg-refresh-old-games"
          gcloud run jobs update bgg-refresh-old-games \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.refresh_old_games \
            --tasks=1 \
            --max-retries=3 \
            --task-timeout=3h \
            --memory=2Gi \
            --cpu=1 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=BGG_API_TOKEN=$_BGG_API_TOKEN
        else
          echo "Creating new job: bgg-refresh-old-games"
          gcloud run jobs create bgg-refresh-old-games \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.refresh_old_games \
            --tasks=1 \
            --max-retries=3 \
            --task-timeout=3h \
            --memory=2Gi \
            --cpu=1 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=BGG_API_TOKEN=$_BGG_API_TOKEN
        fi

  # Deploy Fetch Games (on-demand) Cloud Run Job - Create if not exists, otherwise update
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud run jobs describe bgg-fetch-games --region=us-central1 2>/dev/null; then
          echo "Updating existing job: bgg-fetch-games"
          gcloud run jobs update bgg-fetch-games \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.fetch_games \
            --tasks=1 \
            --max-retries=1 \
            --task-timeout=30m \
            --memory=2Gi \
            --cpu=1 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=BGG_API_TOKEN=$_BGG_API_TOKEN
        else
          echo "Creating new job: bgg-fetch-games"
          gcloud run jobs create bgg-fetch-games \
            --image=gcr.io/$PROJECT_ID/bgg-processor:latest \
            --args=src.pipeline.fetch_games \
            --tasks=1 \
            --max-retries=1 \
            --task-timeout=30m \
            --memory=2Gi \
            --cpu=1 \
            --region=us-central1 \
            --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars=BGG_API_TOKEN=$_BGG_API_TOKEN
        fi

  # TEMPORARY (BGG.CON 2026): the convention library recorder, run once a minute by Cloud
  # Scheduler (terraform/bggcon.tf). One task, no retries, a short timeout: a missed minute is
  # a gap the next run closes. NTFY_TOPIC empty means no alerts. BGGCON_ALERT_USER is whose
  # focus list (bgg-viewer user id) alerts follow.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ACTION=create
        if gcloud run jobs describe bgg-bggcon-recorder --region=us-central1 2>/dev/null; then ACTION=update; fi
        echo "$$ACTION job: bgg-bggcon-recorder"
        gcloud run jobs $$ACTION bgg-bggcon-recorder \
          --image=gcr.io/$PROJECT_ID/bgg-bggcon-recorder:latest \
          --args=src.pipeline.bggcon_recorder \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=60s \
          --memory=512Mi \
          --cpu=1 \
          --region=us-central1 \
          --service-account=bgg-data-warehouse@$PROJECT_ID.iam.gserviceaccount.com \
          --set-env-vars=NTFY_TOPIC=$_NTFY_TOPIC,BGGCON_ALERT_USER=$_BGGCON_ALERT_USER

# Images to push to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/bgg-processor:latest'
  - 'gcr.io/$PROJECT_ID/bgg-bggcon-recorder:latest'

# Timeout for the entire build
timeout: '1800s'  # 30 minutes
