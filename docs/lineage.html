    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        .header {
            background: #1a1a2e;
            color: white;
            padding: 1rem 2rem;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
        }
        #graph {
            width: 100%;
            height: calc(100vh - 60px);
            background: white;
        }
        .controls {
            position: absolute;
            top: 80px;
            right: 20px;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .controls button {
            display: block;
            width: 100%;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .controls button:hover {
            background: #f0f0f0;
        }
        .controls button:last-child {
            margin-bottom: 0;
        }
        .search-box {
            position: absolute;
            top: 80px;
            left: 20px;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .search-box input {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.875rem;
            width: 200px;
        }
        .search-box input:focus {
            outline: none;
            border-color: #1a1a2e;
        }
    </style>
</head>

    <div class="header">
        <h1>Dataform Lineage</h1>
    </div>
    <div class="search-box">
        <input type="text" id="search" placeholder="Search nodes..." onkeyup="searchNodes(this.value)">
    </div>
    <div class="controls">
        <button onclick="network.fit()">Fit to View</button>
        <button onclick="setHierarchical()">Hierarchical</button>

        const container = document.getElementById("graph");
        const data = { nodes: nodes, edges: edges };

        const options = {
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: "LR",
                    sortMethod: "directed",
                    levelSeparation: 250,
                    nodeSpacing: 40,
                    shakeTowards: "roots"
                }
            },
            physics: {
                enabled: false
            },
            edges: {
                smooth: {
                    type: "cubicBezier",
                    forceDirection: "horizontal"
                },
                arrows: {
                    to: { scaleFactor: 0.5 }
                },
                color: { color: "#848484", hover: "#1a1a2e" }
            },
            nodes: {
                shape: "box",
                margin: 10
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                hideEdgesOnDrag: true
            }
        };

        const network = new vis.Network(container, data, options);

        function setHierarchical() {
            network.setOptions({
                layout: {
                    hierarchical: {
                        enabled: true,
                        direction: "LR",
                        sortMethod: "directed",
                        levelSeparation: 250,
                        nodeSpacing: 40,
                        shakeTowards: "roots"
                    }
                },
                physics: { enabled: false }
            });
            network.fit();
        }

        function setFreeform() {
            network.setOptions({
                layout: {
                    hierarchical: { enabled: false }
                },
                physics: {
                    enabled: true,
                    solver: "forceAtlas2Based",
                    forceAtlas2Based: {
                        gravitationalConstant: -50,
                        centralGravity: 0.01,
                        springLength: 150,
                        springConstant: 0.08
                    },
                    stabilization: { iterations: 100 }
                }
            });
        }

        // Fit on load
        network.once("stabilizationIterationsDone", function() {
            network.fit();
        });

        // Highlight connected nodes on hover
        network.on("hoverNode", function(params) {
            const nodeId = params.node;
            const connectedNodes = network.getConnectedNodes(nodeId);
            const connectedEdges = network.getConnectedEdges(nodeId);

            // Dim all nodes except hovered and connected
            nodes.forEach(node => {
                if (node.id === nodeId || connectedNodes.includes(node.id)) {
                    nodes.update({ id: node.id, opacity: 1 });
                } else {
                    nodes.update({ id: node.id, opacity: 0.2 });
                }
            });
        });

        network.on("blurNode", function(params) {
            // Reset all nodes
            nodes.forEach(node => {
                nodes.update({ id: node.id, opacity: 1 });
            });
        });

        // Search functionality
        function searchNodes(query) {
            if (!query) {
                // Reset all nodes to default
                nodes.forEach(node => {
                    nodes.update({ id: node.id, opacity: 1 });
                });
                return;
            }

            query = query.toLowerCase();
            const matchingIds = [];

            nodes.forEach(node => {
                if (node.label.toLowerCase().includes(query)) {
                    matchingIds.push(node.id);
                    nodes.update({ id: node.id, opacity: 1 });
                } else {
                    nodes.update({ id: node.id, opacity: 0.2 });
                }
            });

            // Focus on first match
            if (matchingIds.length > 0) {
                network.focus(matchingIds[0], {
                    scale: 1,
                    animation: { duration: 300 }
                });
            }
        }
    </script>
