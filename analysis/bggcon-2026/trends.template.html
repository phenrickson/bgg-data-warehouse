<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Availability trends</title>
<!-- PLACEHOLDER copy (Phil's to write) -->
<style>/*CSS*/
body{grid-template-columns:1fr min(1240px,100% - 32px) 1fr;padding-top:36px}
#top{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 2px;border-bottom:1px solid var(--border);margin-bottom:20px}
@media(max-width:700px){#top{position:static}}
.bar{margin-top:8px}.bar select,.bar .btn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:5px 12px;min-height:36px}.bar .btn{cursor:pointer}.bar .btn:hover{background:var(--fill)}
.bar .lb{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:13px}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:22px 28px}
.c{content-visibility:auto;contain-intrinsic-size:auto 150px;min-width:0}.c b{display:block;font-size:15px;line-height:1.3;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c>span{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.c svg{display:block;width:100%;overflow:visible}.c text{font-size:9.5px;fill:var(--muted)}.c text.tr{fill:var(--hot)}.c text.hr{fill:var(--lit)}
.hrs{fill:color-mix(in oklab,var(--lit) 55%,var(--bg))}.base{fill:var(--border)}.ln{fill:none}.ln.lib{stroke:var(--muted);stroke-width:1}.ln.tr{stroke:var(--hot);stroke-width:2}.ln.rt{stroke:var(--fg);stroke-width:1.4}.zero{stroke:var(--border)}
.v0,.v1,.v2,.v3{display:none}.s0 .v0,.s1 .v1,.s2 .v2,.s3 .v3{display:inline}.tag{display:none}.end .tag{display:inline}
</style></head><body>
<h1>Availability trends</h1>
<div id="top">
<div class="bar"><input type="search" id="q" placeholder="Find a game" aria-label="Find a game" style="margin-left:0"><select id="s" aria-label="Sort"><option value="r">Shuffled</option><option value="n">Name</option><option value="net">Rose most</option><option value="-net">Fell most</option><option value="amp">Trend moves most</option><option value="-amp">Trend moves least</option><option value="m">Most time all out</option><option value="c">Most checkouts</option></select><button type="button" class="btn" id="b">Shuffle</button><span class="count" id="t"></span></div>
<div class="bar"><span class="lb">Copies <span class="seg" data-f="k" role="group" aria-label="Copies"></span></span><span class="lb">Checkouts <span class="seg" data-f="c" role="group" aria-label="Checkouts"></span></span><span class="lb">Smoothness <span class="seg" data-f="w" role="group" aria-label="Smoothness"></span></span></div>
<div class="lg"><span><i style="background:color-mix(in oklab,var(--lit) 55%,var(--bg))"></i>Share of each hour with every copy out</span><span><i class="ln" style="border-top:2px solid var(--hot)"></i>Trend</span><span><i class="ln" style="border-top:1px solid var(--muted)"></i>Library: all copies out, as a share of its peak (compare direction, not height)</span><span><i class="ln" style="border-top:2px solid var(--fg)"></i>Trend's rate of change</span></div>
</div>
<div id="g"><!--CARDS--></div>
<script>
const $ = i => document.getElementById(i), C = [...document.querySelectorAll('.c')], F = { k: 0, c: 3, w: /*DEFAULT*/ };
const OPTS = { k: [[0, 'All'], [1, 'One'], [2, 'Two or more']], c: [3, 4, 5, 6, 8, 10].map(n => [n, n + '+']), w: /*SMOOTH*/.map((l, i) => [i, 'λ ' + l]) };
for (const el of document.querySelectorAll('[data-f]')) for (const [v, t] of OPTS[el.dataset.f]) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.dataset.v = v; b.onclick = () => { F[el.dataset.f] = v; press(); go(); }; el.append(b);
}
function press() { for (const b of document.querySelectorAll('[data-f] button')) { const on = F[b.parentNode.dataset.f] == b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); } }
function ends() { const n = getComputedStyle($('g')).gridTemplateColumns.split(' ').length; [...$('g').children].forEach((c, i) => c.classList.toggle('end', i % n === 0 || i % n === n - 1)); } // labels on the first and last chart in each row
function go() {
  const s = $('s').value, q = $('q').value.toLowerCase(), key = s.replace('-', ''), sign = s[0] === '-' ? -1 : 1; $('g').className = 's' + F.w;
  const val = c => key === 'net' || key === 'amp' ? +c.dataset[key + 's'].split(',')[F.w] : +c.dataset[key];
  const list = C.filter(c => (!F.k || (F.k === 1 ? c.dataset.k == 1 : c.dataset.k > 1)) && +c.dataset.c >= F.c && c.dataset.n.includes(q));
  list.sort((a, b) => s === 'r' ? a.r - b.r : s === 'n' ? a.dataset.n.localeCompare(b.dataset.n) : sign * (val(b) - val(a)));
  $('g').replaceChildren(...list); ends(); $('t').textContent = list.length.toLocaleString() + ' games';
}
function shuffle() { C.forEach(c => c.r = Math.random()); $('s').value = 'r'; go(); }
$('q').oninput = $('s').onchange = go; $('b').onclick = () => { shuffle(); scrollTo(0, 0); }; onresize = ends; press(); shuffle();
</script></body></html>
