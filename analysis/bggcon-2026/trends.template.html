<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Availability trends</title>
<!-- PLACEHOLDER copy (Phil's to write) -->
<style>/*CSS*/
body{grid-template-columns:1fr min(1240px,100% - 32px) 1fr;padding-top:36px}
#top{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 2px;border-bottom:1px solid var(--border);margin-bottom:20px}
@media(max-width:700px){#top{position:static}}
.bar{margin-top:8px}.bar select,.bar .btn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:5px 12px;min-height:36px}.bar .btn{cursor:pointer}.bar .btn:hover{background:var(--fill)}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:22px 28px}
.c{content-visibility:auto;contain-intrinsic-size:auto 150px;min-width:0}.c b{cursor:pointer}.c b:hover{text-decoration:underline}.c b{display:block;font-size:15px;line-height:1.3;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c>span{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.c svg{display:block;width:100%;overflow:visible}.c text{font-size:9.5px;fill:var(--muted)}.c text.tr{fill:var(--hot)}.c text.hr{fill:var(--lit)}.c text.up{fill:var(--w2)}.c text.dn{fill:var(--w0)}
.hrs{fill:color-mix(in oklab,var(--lit) 55%,var(--bg))}.base{fill:var(--border)}.ln{fill:none}.ln.lib{stroke:var(--muted);stroke-width:1}.ln.tr{stroke:var(--hot);stroke-width:2}.ln.rt{stroke:url(#rate);stroke-width:1.6}.ln.flat{stroke:var(--muted)}.area{fill:url(#rate);opacity:.28}.zero{stroke:var(--border)}
.v0,.v1,.v2,.v3{display:none}.s0 .v0,.s1 .v1,.s2 .v2,.s3 .v3{display:inline}.tag{display:none}.end .tag{display:inline}
</style></head><body>
<!-- rising above the middle, cooling below it, gray where it's about steady -->
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rate" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="/*STRIP*/"><stop offset=".48" stop-color="var(--w2)"/><stop offset=".48" stop-color="var(--muted)"/><stop offset=".52" stop-color="var(--muted)"/><stop offset=".52" stop-color="var(--w0)"/></linearGradient></defs></svg>
<h1>Availability trends</h1>
<div id="top">
<div class="bar"><input type="search" id="q" placeholder="Find a game" aria-label="Find a game" style="margin-left:0"><select id="s" aria-label="Sort"><option value="r">Shuffled</option><option value="n">Name</option><option value="net">Rose most</option><option value="-net">Fell most</option><option value="amp">Trend moves most</option><option value="-amp">Trend moves least</option><option value="d">Days most alike</option><option value="m">Most time all out</option><option value="c">Most checkouts</option></select><button type="button" class="btn" id="b">Shuffle</button><select data-f="k" aria-label="Copies"></select><select data-f="c" aria-label="Checkouts"></select><select data-f="w" aria-label="Smoothness"></select><span class="count" id="t"></span></div>
<div class="lg"><span><i style="background:color-mix(in oklab,var(--lit) 55%,var(--bg))"></i>All out: share of the hour when every copy was out</span><span><i class="ln" style="border-top:2px solid var(--hot)"></i>Trend</span><span><i class="ln" style="border-top:1px solid var(--muted)"></i>Library: all copies out, as a share of its peak (compare direction, not height)</span><span><i style="background:var(--w2)"></i>Rising</span><span><i style="background:var(--w0)"></i>Cooling</span></div>
</div>
<div id="g"><!--CARDS--></div>
<script>
const $ = i => document.getElementById(i), C = [...document.querySelectorAll('.c')], T = new Map(), F = { k: 0, c: 3, w: /*DEFAULT*/ };
const OPTS = { k: [[0, 'Any number of copies'], [1, 'One copy'], [2, 'Two or more copies']], c: [3, 4, 5, 6, 8, 10].map(n => [n, n + '+ checkouts']), w: /*SMOOTH*/.map((l, i) => [i, 'Smoothness λ ' + l]) };
for (const el of document.querySelectorAll('[data-f]')) {
  for (const [v, t] of OPTS[el.dataset.f]) el.add(new Option(t, v));
  el.value = F[el.dataset.f]; el.onchange = () => { F[el.dataset.f] = +el.value; go(); };
}
function ends() { const n = getComputedStyle($('g')).gridTemplateColumns.split(' ').length; [...$('g').children].forEach((c, i) => c.classList.toggle('end', i % n === 0 || i % n === n - 1)); } // labels on the first and last chart in each row
// Similar cycles: correlation between two games' trends (at the default smoothness). A game that never moves matches nothing.
function moves(c) { if (!T.has(c)) { const v = c.dataset.t.split(',').map(Number), m = v.reduce((a, b) => a + b) / v.length, d = v.map(x => x - m), n = Math.hypot(...d); T.set(c, n > .2 ? d.map(x => x / n) : null); } return T.get(c); }
let like = null;
function alike(c) { const a = moves(like), b = moves(c); return c === like ? 2 : a && b ? a.reduce((t, x, i) => t + x * b[i], 0) : -2; }
$('g').onclick = e => { const b = e.target.closest('b'); if (!b) return; like = b.parentNode; let o = $('s').querySelector('[value=like]'); if (!o) $('s').add(o = new Option('', 'like')); o.textContent = 'Similar to ' + b.textContent; $('s').value = 'like'; $('q').value = ''; go(); scrollTo(0, 0); };
function go() {
  const s = $('s').value, q = $('q').value.toLowerCase(), key = s.replace('-', ''), sign = s[0] === '-' ? -1 : 1; $('g').className = 's' + F.w;
  const val = c => s === 'like' ? alike(c) : key === 'net' || key === 'amp' ? +c.dataset[key + 's'].split(',')[F.w] : +c.dataset[key];
  const list = C.filter(c => (!F.k || (F.k === 1 ? c.dataset.k == 1 : c.dataset.k > 1)) && +c.dataset.c >= F.c && c.dataset.n.includes(q));
  list.sort((a, b) => s === 'r' ? a.r - b.r : s === 'n' ? a.dataset.n.localeCompare(b.dataset.n) : sign * (val(b) - val(a)));
  $('g').replaceChildren(...list); ends(); $('t').textContent = list.length.toLocaleString() + ' games';
}
function shuffle() { C.forEach(c => c.r = Math.random()); $('s').value = 'r'; go(); }
$('q').oninput = $('s').onchange = go; $('b').onclick = () => { shuffle(); scrollTo(0, 0); }; onresize = ends; shuffle();
</script></body></html>
