name: Scrape Heartbeat

# Fetch Thing IDs is scheduled again, so a failed run raises its own red X. What
# that can't catch is the schedule silently not firing at all - GitHub disables
# cron triggers on inactive repos - so this checks that a *successful* run landed
# within the threshold, whatever triggered it (schedule, manual, or home box).
on:
  schedule:
    - cron: '0 12 * * *'  # 6h after the box's 06:00 UTC slot
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check-heartbeat:
    name: Warn if ID discovery has not run
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent successful Fetch Thing IDs run
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_HOURS: '26'  # normal age ~6h; a single missed daily run = ~30h, trips cleanly
        run: |
          # Most recent successful "Fetch Thing IDs" run, regardless of trigger.
          LAST=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/fetch_thing_ids.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST" ]; then
            echo "::error::No successful Fetch Thing IDs run found at all."
            exit 1
          fi

          LAST_EPOCH=$(date -d "$LAST" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_HOURS=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
          echo "Last successful ID discovery: $LAST (${AGE_HOURS}h ago)"

          if [ "$AGE_HOURS" -gt "$THRESHOLD_HOURS" ]; then
            echo "::error::No successful ID discovery in ${AGE_HOURS}h (> ${THRESHOLD_HOURS}h). Check that the schedule is still firing."
            exit 1
          fi
          echo "Heartbeat OK."
