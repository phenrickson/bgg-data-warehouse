name: Scrape Heartbeat

# A failed discovery run raises its own red X. What that can't catch is the
# chain silently not running at all - a cron GitHub stopped firing, a workflow
# left disabled, a home box that never dispatched. So this checks the outcome:
# that Fetch New Games succeeded within the threshold. Every discovery path
# ends there (Actions via workflow_run, the home box via repository_dispatch),
# so it is green whichever one did the work - unlike checking Fetch Thing IDs
# runs, which the home-box path never produces.
on:
  schedule:
    - cron: '0 12 * * *'  # 6h after the box's 06:00 UTC slot
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check-heartbeat:
    name: Warn if ID discovery has not run
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent successful Fetch New Games run
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_HOURS: '26'  # normal age ~6h; a single missed daily run = ~30h, trips cleanly
        run: |
          # Most recent successful "Run Fetch New Games" run, regardless of trigger.
          # Take the max over a window rather than element 0: the runs listing has
          # served a stale, out-of-order page before, and per_page=1 turns a single
          # misordered element into a false alarm.
          LAST=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/fetch_new_games.yml/runs?status=success&per_page=20" \
            --jq '[.workflow_runs[].created_at] | max // empty')

          if [ -z "$LAST" ]; then
            echo "::error::No successful Fetch New Games run found at all."
            exit 1
          fi

          LAST_EPOCH=$(date -d "$LAST" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_HOURS=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
          echo "Last successful Fetch New Games: $LAST (${AGE_HOURS}h ago)"

          if [ "$AGE_HOURS" -gt "$THRESHOLD_HOURS" ]; then
            echo "::error::No successful Fetch New Games in ${AGE_HOURS}h (> ${THRESHOLD_HOURS}h). Neither the Actions schedule nor the home box completed discovery."
            exit 1
          fi
          echo "Heartbeat OK."
