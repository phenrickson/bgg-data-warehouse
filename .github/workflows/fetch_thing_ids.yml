name: Fetch Thing IDs

on:
  # ID discovery probes the XML API rather than scraping sitemaps, so it no
  # longer needs residential egress: Cloudflare blocks datacenter IPs on the
  # HTML/sitemap paths, but the authenticated API is unaffected. Scheduling
  # therefore moved back here from the home box.
  # Two windows, one probe. Most newly published IDs sit below the frontier
  # (reserved on submission, visible after approval), so the daily run looks
  # back 500 and the Sunday run 5,000. See
  # docs/superpowers/specs/2026-09-18-id-probe-lookback-design.md.
  schedule:
    - cron: '0 6 * * 1-6'  # 01:00 US Central; frontier + 500 back
    - cron: '0 6 * * 0'    # Sunday: frontier + 5,000 back
  workflow_dispatch:
    inputs:
      source:
        description: 'Discovery method'
        type: choice
        options: [bgg_api_probe, bgg_sitemap]
        default: bgg_api_probe
      lookback:
        description: 'IDs below the known max to re-probe (probe only)'
        type: number
        default: 500

env:
  GCP_PROJECT_ID: bgg-data-warehouse
  GCP_REGION: us-central1

jobs:
  fetch-thing-ids:
    name: Fetch Thing IDs from BGG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BGG_DW }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Install browser (sitemap mode only)
        if: ${{ inputs.source == 'bgg_sitemap' }}
        run: uv run playwright install --with-deps chromium

      - name: Get pre-run counts
        id: before
        run: |
          bq query --nouse_legacy_sql --format=csv \
            "SELECT type, COUNT(*) as cnt FROM \`bgg-data-warehouse.raw.thing_ids\` GROUP BY type ORDER BY type" \
            | tail -n +2 > /tmp/before_counts.csv
          TOTAL=$(bq query --nouse_legacy_sql --format=csv \
            "SELECT COUNT(*) as cnt FROM \`bgg-data-warehouse.raw.thing_ids\`" | tail -1)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Resolve lookback
        id: lookback
        run: |
          if [ -n "${{ inputs.lookback }}" ]; then
            LB="${{ inputs.lookback }}"
          elif [ "$(date -u +%u)" = "7" ]; then
            LB=5000
          else
            LB=500
          fi
          echo "lookback=$LB" >> $GITHUB_OUTPUT
          echo "Lookback: $LB"

      - name: Fetch Thing IDs
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          uv run python -m src.pipeline.fetch_thing_ids \
            --source "${{ inputs.source || 'bgg_api_probe' }}" \
            --lookback "${{ steps.lookback.outputs.lookback }}"

      - name: Write job summary
        if: always()
        run: |
          bq query --nouse_legacy_sql --format=csv \
            "SELECT type, COUNT(*) as cnt FROM \`bgg-data-warehouse.raw.thing_ids\` GROUP BY type ORDER BY type" \
            | tail -n +2 > /tmp/after_counts.csv
          TOTAL=$(bq query --nouse_legacy_sql --format=csv \
            "SELECT COUNT(*) as cnt FROM \`bgg-data-warehouse.raw.thing_ids\`" | tail -1)
          BEFORE=${{ steps.before.outputs.total }}
          NEW_IDS=$(( TOTAL - ${BEFORE:-0} ))

          echo "## Fetch Thing IDs Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lookback | ${{ steps.lookback.outputs.lookback }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New IDs added | ${NEW_IDS} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total IDs** | **${TOTAL}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Counts by type" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Before | After | New |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-------|-----|" >> $GITHUB_STEP_SUMMARY
          while IFS=, read -r type after_cnt; do
            before_cnt=$(grep "^${type}," /tmp/before_counts.csv | cut -d, -f2)
            before_cnt=${before_cnt:-0}
            new_cnt=$(( after_cnt - before_cnt ))
            echo "| ${type} | ${before_cnt} | ${after_cnt} | ${new_cnt} |" >> $GITHUB_STEP_SUMMARY
          done < /tmp/after_counts.csv
